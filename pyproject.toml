[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hydra"
version = "1.0.0"
description = "Cockpit desktop de navegadores isolados por perfil"
requires-python = ">=3.12,<3.14"
dependencies = [
    "PySide6>=6.11,<6.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.13,<0.15",
]

[project.scripts]
hydra = "hydra.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["hydra"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
